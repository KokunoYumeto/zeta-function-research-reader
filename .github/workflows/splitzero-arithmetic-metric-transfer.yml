name: SplitZero arithmetic metric transfer

on:
  push:
    branches: [main, 'astra/arithmetic-metric-transfer-20260913']
    paths:
      - 'formal/splitzero/**'
      - 'workbenches/tau-arithmetic-metric-transfer/**'
      - 'workbenches/tau-split-integration/**'
      - 'workbenches/tau-residue-rigidity/**'
      - '.github/workflows/splitzero-arithmetic-metric-transfer.yml'
  pull_request:
    paths:
      - 'formal/splitzero/**'
      - 'workbenches/tau-arithmetic-metric-transfer/**'
      - 'workbenches/tau-split-integration/**'
      - 'workbenches/tau-residue-rigidity/**'
      - '.github/workflows/splitzero-arithmetic-metric-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: splitzero-arithmetic-metric-transfer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        working-directory: formal/splitzero
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover the original scalar and test the inherited fail-closed parser
        run: |
          set -euo pipefail
          python3 prepare.py
          SCRIPT=../../workbenches/tau-arithmetic-metric-transfer/run_metric_transfer.py
          python3 "$SCRIPT" --selftest > /tmp/parser-normal.json
          python3 -O "$SCRIPT" --selftest > /tmp/parser-optimized.json
          cmp /tmp/parser-normal.json /tmp/parser-optimized.json
          cat /tmp/parser-normal.json
          for MODE in normal optimized; do
            if [ "$MODE" = normal ]; then PY=(python3); else PY=(python3 -O); fi
            if "${PY[@]}" "$SCRIPT" --negative > /tmp/parser-negative-$MODE.log 2>&1; then exit 1; fi
            grep -q 'nonstandard axioms' /tmp/parser-negative-$MODE.log
          done
      - name: Install the unchanged Lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve the pinned Mathlib dependency and cache
        run: |
          set -euo pipefail
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get
          lake build
      - name: Strictly check the complete used source closure and signed composites
        run: python3 ../../workbenches/tau-arithmetic-metric-transfer/run_metric_transfer.py
      - name: Independently replay exact source and signed-certificate regressions
        run: |
          set -euo pipefail
          python3 -m pip install sympy==1.14.0
          SCRIPT=../../workbenches/tau-arithmetic-metric-transfer/check_metric_transfer.py
          python3 "$SCRIPT" --output /tmp/metric-normal.json
          python3 -O "$SCRIPT" --output /tmp/metric-optimized.json
          cmp /tmp/metric-normal.json /tmp/metric-optimized.json
          for MODE in normal optimized; do
            if [ "$MODE" = normal ]; then PY=(python3); else PY=(python3 -O); fi
            for CONTROL in omit-boundary-loss reverse-signed-log; do
              if "${PY[@]}" "$SCRIPT" --negative-control "$CONTROL" > /tmp/metric-$MODE-$CONTROL.log 2>&1; then exit 1; fi
              grep -q '"false_claim_accepted": false' /tmp/metric-$MODE-$CONTROL.log
            done
          done
          RESIDUE=../../workbenches/tau-residue-rigidity/check_exact.py
          ADAPTIVE=../../workbenches/tau-residue-rigidity/check_adaptive.py
          python3 "$RESIDUE" > /tmp/residue-normal.json
          python3 -O "$RESIDUE" > /tmp/residue-optimized.json
          cmp /tmp/residue-normal.json /tmp/residue-optimized.json
          cat /tmp/residue-normal.json
          python3 "$ADAPTIVE" > /tmp/adaptive-normal.json
          python3 -O "$ADAPTIVE" > /tmp/adaptive-optimized.json
          cmp /tmp/adaptive-normal.json /tmp/adaptive-optimized.json
          cat /tmp/adaptive-normal.json
          for MODE in normal optimized; do
            if [ "$MODE" = normal ]; then PY=(python3); else PY=(python3 -O); fi
            for CONTROL in rank source-sign; do
              if "${PY[@]}" "$RESIDUE" --negative "$CONTROL" > /tmp/residue-$MODE-$CONTROL.log 2>&1; then exit 1; fi
              grep -q 'deliberate false' /tmp/residue-$MODE-$CONTROL.log
            done
          done
          python3 -m unittest test_derived_checker test_synchronization_checker test_tau_recovery
          python3 -O -m unittest test_derived_checker test_synchronization_checker test_tau_recovery
      - name: Replay the original derived audit and reject zero/absence identification
        run: |
          set -euo pipefail
          python3 check_derived.py --prepare
          lake env lean --trust=0 -DwarningAsError=true AuditDerived.lean > /tmp/metric-derived.log
          python3 check_derived.py /tmp/metric-derived.log
          printf 'import SplitZeroMetricVariationSupport\nexample : (SplitZero.e : SplitZero.G ℤ) = SplitZero.tau := by rfl\n' > MetricMustFail.lean
          if lake env lean --trust=0 -DwarningAsError=true MetricMustFail.lean > /tmp/metric-must-fail.log 2>&1; then exit 1; fi
          grep -qi 'rfl.*failed\|failed.*rfl' /tmp/metric-must-fail.log
          if grep -qi 'unknown module\|unknown identifier\|failed to synthesize' /tmp/metric-must-fail.log; then exit 1; fi
          cat /tmp/metric-must-fail.log
      - name: Record the actual execution scope
        run: |
          git rev-parse HEAD
          lake env lean --version
          cat .metric-transfer-logs/receipt.json
