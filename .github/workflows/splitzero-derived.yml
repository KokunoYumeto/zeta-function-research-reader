name: SplitZero derived constructions
on:
  push:
    branches: [codex/splitzero-derived-20260912]
  pull_request:
    paths: ['formal/splitzero/**', '.github/workflows/splitzero-derived.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derived:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: 1
    defaults:
      run:
        working-directory: formal/splitzero
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned environment
        run: |
          set -euo pipefail
          python3 prepare.py
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake update >DerivedSetup.log 2>&1 || { tail -60 DerivedSetup.log; exit 1; }
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get >>DerivedSetup.log 2>&1 || { tail -60 DerivedSetup.log; exit 1; }
      - name: Compile original package and derived sources
        run: |
          set -euo pipefail
          lake -KmaxJobs=1 build >DerivedBuild.log 2>&1 || { cat DerivedBuild.log; exit 1; }
          tail -30 DerivedBuild.log
          for name in SplitZeroReconstruction SplitZeroHomology SplitZeroInternalQuotient SplitZeroHomologyExample SplitZeroFiniteJets; do
            if test -f "$name.lean"; then
              lake env lean --trust=0 -DwarningAsError=true -o ".lake/build/lib/lean/$name.olean" "$name.lean"
            fi
          done
          lake env lean --trust=0 -DwarningAsError=true Audit.lean >Audit.log
          python3 check_axioms.py Audit.log
          python3 test_axioms.py -v
          if test -f AuditDerived.lean; then
            lake env lean --trust=0 -DwarningAsError=true AuditDerived.lean | tee AuditDerived.log
            python3 check_derived.py AuditDerived.log
          fi
