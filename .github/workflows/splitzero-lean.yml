name: SplitZero Lean foundations
on:
  push:
    branches: [codex/splitzero-lean-foundations-20260912]
    paths: ['workbenches/splitzero-lean/**', '.github/workflows/splitzero-lean.yml']
  pull_request:
    paths: ['workbenches/splitzero-lean/**', '.github/workflows/splitzero-lean.yml']
permissions:
  contents: read
jobs:
  splitzero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 1
    defaults:
      run:
        working-directory: workbenches/splitzero-lean
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test checker and prepare named-declaration audit
        run: |
          python3 -m unittest -v test_check.py
          python3 check.py --prepare
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake update >Setup.log 2>&1 || { tail -60 Setup.log; exit 1; }
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get >>Setup.log 2>&1 || { tail -60 Setup.log; exit 1; }
      - name: Compile every module and audit transitive axioms
        run: |
          set -euo pipefail
          lake -KmaxJobs=1 build SplitZero >Build.log 2>&1 || { cat Build.log; exit 1; }
          cat Build.log
          for source in SplitZero/*.lean; do
            lake env lean --trust=0 -DwarningAsError=true "$source"
          done
          lake env lean --trust=0 -DwarningAsError=true Audit.lean | tee Audit.log
          python3 check.py --log Audit.log
