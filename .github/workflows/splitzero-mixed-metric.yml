name: SplitZero mixed support and source-metric recovery
on:
  push:
    branches: [main, 'astra/mixed-support-metric-recovery-20260913']
    paths:
      - 'formal/splitzero/**'
      - 'workbenches/tau-mixed-metric-integration/**'
      - 'workbenches/tau-source-resolvent/**'
      - 'workbenches/tau-arithmetic-metric-transfer/**'
      - 'workbenches/tau-split-integration/**'
      - 'workbenches/tau-residue-rigidity/**'
      - '.github/workflows/splitzero-mixed-metric.yml'
  pull_request:
    paths:
      - 'formal/splitzero/**'
      - 'workbenches/tau-mixed-metric-integration/**'
      - 'workbenches/tau-source-resolvent/**'
      - 'workbenches/tau-arithmetic-metric-transfer/**'
      - 'workbenches/tau-split-integration/**'
      - 'workbenches/tau-residue-rigidity/**'
      - '.github/workflows/splitzero-mixed-metric.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: splitzero-mixed-metric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        working-directory: formal/splitzero
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover original scalar and verify fail-closed audit parser
        run: |
          set -euo pipefail
          python3 prepare.py
          SCRIPT=../../workbenches/tau-mixed-metric-integration/run_mixed.py
          python3 "$SCRIPT" --selftest > /tmp/parser-normal.json
          python3 -O "$SCRIPT" --selftest > /tmp/parser-optimized.json
          cmp /tmp/parser-normal.json /tmp/parser-optimized.json
          cat /tmp/parser-normal.json
          for MODE in normal optimized; do
            if [ "$MODE" = normal ]; then PY=(python3); else PY=(python3 -O); fi
            if "${PY[@]}" "$SCRIPT" --negative > /tmp/parser-negative-$MODE.log 2>&1; then exit 1; fi
            grep -q 'nonstandard axioms' /tmp/parser-negative-$MODE.log
          done
      - name: Install unchanged Lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve unchanged Mathlib and build the original library
        run: |
          set -euo pipefail
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get
          lake build
      - name: Strictly check complete inherited, recovered and mixed-source closure
        run: python3 ../../workbenches/tau-mixed-metric-integration/run_mixed.py
      - name: Replay derived audit and reject identification of e with absence
        run: |
          set -euo pipefail
          python3 check_derived.py --prepare
          lake env lean --trust=0 -DwarningAsError=true AuditDerived.lean > /tmp/mixed-derived.log
          python3 check_derived.py /tmp/mixed-derived.log
          printf 'import SplitZeroMixedSupportMetric\nexample : (SplitZero.e : SplitZero.G ℤ) = SplitZero.tau := by rfl\n' > MixedMetricMustFail.lean
          if lake env lean --trust=0 -DwarningAsError=true MixedMetricMustFail.lean > /tmp/mixed-must-fail.log 2>&1; then exit 1; fi
          grep -qi 'rfl.*failed\|failed.*rfl' /tmp/mixed-must-fail.log
          if grep -qi 'unknown module\|unknown identifier\|failed to synthesize' /tmp/mixed-must-fail.log; then exit 1; fi
          cat /tmp/mixed-must-fail.log
      - name: Report exact source and execution scope
        run: |
          git rev-parse HEAD
          lake env lean --version
          cat .mixed-metric-logs/receipt.json
  finite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned finite-check dependency
        run: python3 -m pip install sympy==1.14.0
      - name: Independent exact mixed-support and weighted-source checks
        shell: bash
        run: |
          set -euo pipefail
          for PACKAGE in tau-source-resolvent tau-mixed-metric-integration; do
            SCRIPT=workbenches/$PACKAGE/check_exact.py
            python3 "$SCRIPT" > /tmp/$PACKAGE-normal.json
            python3 -O "$SCRIPT" > /tmp/$PACKAGE-optimized.json
            cmp /tmp/$PACKAGE-normal.json /tmp/$PACKAGE-optimized.json
            cat /tmp/$PACKAGE-normal.json
          done
          for MODE in normal optimized; do
            if [ "$MODE" = normal ]; then PY=(python3); else PY=(python3 -O); fi
            for CONTROL in omit-loss subtract-upper-prefixes; do
              if "${PY[@]}" workbenches/tau-source-resolvent/check_exact.py --negative "$CONTROL" > /tmp/old-$MODE-$CONTROL.log 2>&1; then exit 1; fi
              grep -q '"false_claim_accepted": false' /tmp/old-$MODE-$CONTROL.log
            done
            for CONTROL in diagonal-only absent-join omit-boundary; do
              if "${PY[@]}" workbenches/tau-mixed-metric-integration/check_exact.py --negative "$CONTROL" > /tmp/new-$MODE-$CONTROL.log 2>&1; then exit 1; fi
              grep -q '"false_claim_accepted": false' /tmp/new-$MODE-$CONTROL.log
            done
          done
      - name: Replay inherited source and synchronization checker tests
        shell: bash
        run: |
          set -euo pipefail
          OLD=workbenches/tau-arithmetic-metric-transfer/check_metric_transfer.py
          python3 "$OLD" --output /tmp/old-metric-normal.json
          python3 -O "$OLD" --output /tmp/old-metric-optimized.json
          cmp /tmp/old-metric-normal.json /tmp/old-metric-optimized.json
          cd formal/splitzero
          python3 -m unittest test_derived_checker test_synchronization_checker test_tau_recovery
          python3 -O -m unittest test_derived_checker test_synchronization_checker test_tau_recovery
