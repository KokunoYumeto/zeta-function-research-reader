name: SplitZero period integration

on:
  push:
    branches: [main, 'astra/splitzero-period-integration-20260913']
    paths:
      - 'formal/splitzero/**'
      - 'workbenches/tau-split-integration/**'
      - '.github/workflows/splitzero-period-integration.yml'
  pull_request:
    paths:
      - 'formal/splitzero/**'
      - 'workbenches/tau-split-integration/**'
      - '.github/workflows/splitzero-period-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splitzero-period-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        working-directory: formal/splitzero
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover the unchanged original scalar source
        run: python3 prepare.py
      - name: Verify the fail-closed audit parser in both Python modes
        run: |
          set -euo pipefail
          SCRIPT=../../workbenches/tau-split-integration/run_integration.py
          python3 "$SCRIPT" --selftest > /tmp/integration-normal.json
          python3 -O "$SCRIPT" --selftest > /tmp/integration-optimized.json
          cmp /tmp/integration-normal.json /tmp/integration-optimized.json
          cat /tmp/integration-normal.json
          for MODE in normal optimized; do
            if [ "$MODE" = normal ]; then PY=(python3); else PY=(python3 -O); fi
            if "${PY[@]}" "$SCRIPT" --negative > /tmp/integration-negative-$MODE.log 2>&1; then
              echo 'Forbidden audit report was accepted'; exit 1
            fi
            grep -q 'nonstandard axioms' /tmp/integration-negative-$MODE.log
          done
          python3 -m unittest test_derived_checker test_synchronization_checker test_tau_recovery
          python3 -O -m unittest test_derived_checker test_synchronization_checker test_tau_recovery
      - name: Install the inherited Lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the unchanged Mathlib pin and cache
        run: |
          set -euo pipefail
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get
          lake build
      - name: Strictly compile the complete used SplitZero dependency closure and audit the new composites
        run: python3 ../../workbenches/tau-split-integration/run_integration.py
      - name: Replay the original reconstruction and homology axiom audit
        run: |
          set -euo pipefail
          python3 check_derived.py --prepare
          lake env lean --trust=0 -DwarningAsError=true AuditDerived.lean > /tmp/inherited-derived.log
          python3 check_derived.py /tmp/inherited-derived.log
      - name: Reject the deliberate identification of supported zero with absence
        run: |
          set -euo pipefail
          printf 'import SplitZeroResidueSupport\nexample : (SplitZero.e : SplitZero.G ℤ) = SplitZero.tau := by rfl\n' > IntegrationMustFail.lean
          if lake env lean --trust=0 -DwarningAsError=true IntegrationMustFail.lean > /tmp/integration-must-fail.log 2>&1; then
            echo 'The false zero identification compiled'; exit 1
          fi
          cat /tmp/integration-must-fail.log
          grep -qi 'rfl.*failed\|failed.*rfl' /tmp/integration-must-fail.log
          if grep -qi 'unknown module\|unknown identifier\|failed to synthesize' /tmp/integration-must-fail.log; then
            echo 'Negative control failed for an unrelated reason'; exit 1
          fi
      - name: Report exact execution checkpoint
        run: |
          git rev-parse HEAD
          lake env lean --version
          cat .integration-logs/receipt.json
