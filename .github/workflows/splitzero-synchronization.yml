name: SplitZero actual synchronization
on:
  push:
    branches: [codex/splitzero-synchronization-20260912]
  pull_request:
    paths: ['formal/splitzero/**', '.github/workflows/splitzero-synchronization.yml']
permissions:
  contents: read
jobs:
  synchronization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 1
    defaults:
      run:
        working-directory: formal/splitzero
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve and verify the original core; test the additional checker
        run: |
          python3 prepare.py
          python3 -m unittest -v test_synchronization_checker.py
          python3 check_synchronization.py --prepare
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake update >SynchronizationSetup.log 2>&1 || { tail -60 SynchronizationSetup.log; exit 1; }
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get >>SynchronizationSetup.log 2>&1 || { tail -60 SynchronizationSetup.log; exit 1; }
      - name: Build existing structure and actual synchronization; audit both
        run: |
          set -euo pipefail
          lake -KmaxJobs=1 build >SynchronizationBuild.log 2>&1 || { cat SynchronizationBuild.log; exit 1; }
          tail -60 SynchronizationBuild.log
          lake env lean --trust=0 SplitZero.lean
          for source in SplitZeroExtension.lean SplitZeroFibres.lean SplitZeroPresentation.lean SplitZeroMaps.lean SplitZeroSynchronization.lean; do
            lake env lean --trust=0 -DwarningAsError=true "$source"
          done
          lake env lean --trust=0 -DwarningAsError=true Audit.lean >Audit.log
          python3 check_axioms.py Audit.log
          python3 test_axioms.py -v
          lake env lean --trust=0 -DwarningAsError=true AuditSynchronization.lean | tee AuditSynchronization.log
          python3 check_synchronization.py --log AuditSynchronization.log
