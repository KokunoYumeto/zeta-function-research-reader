name: SplitZero tau-base constructions
on:
  push:
    branches: [codex/splitzero-tau-base-20260912]
    paths: ['formal/splitzero/**', '.github/workflows/splitzero-tau.yml']
  pull_request:
    paths: ['formal/splitzero/**', '.github/workflows/splitzero-tau.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tau:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        working-directory: formal/splitzero
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned environment
        run: |
          set -euo pipefail
          python3 prepare.py
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake update >TauSetup.log 2>&1 || { tail -60 TauSetup.log; exit 1; }
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get >>TauSetup.log 2>&1 || { tail -60 TauSetup.log; exit 1; }
      - name: Build unchanged prior package
        run: |
          set -euo pipefail
          lake -KmaxJobs=2 build >TauPriorBuild.log 2>&1 || { cat TauPriorBuild.log; exit 1; }
          tail -25 TauPriorBuild.log
      - name: Check every tau module with the kernel
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r name; do
            test -n "$name" || continue
            echo "=== $name ==="
            if ! lake env lean --trust=0 -DwarningAsError=true -o ".lake/build/lib/lean/$name.olean" "$name.lean"; then status=1; fi
          done < TAU_MODULES.txt
          exit "$status"
