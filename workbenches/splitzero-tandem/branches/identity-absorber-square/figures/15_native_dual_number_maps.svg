<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#20596b"/></marker></defs>
<rect width="1200" height="650" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172a37" text-anchor="middle">
<text x="600" y="45" font-size="27">The same standard infinitesimal, with exact connecting maps</text>
<text x="600" y="80" font-size="18">NI3, NI6, NI11–13: all operators retain the original metric and ε_N</text>
<g fill="#eaf4f6" stroke="#20596b" stroke-width="2">
<rect x="80" y="125" width="370" height="95" rx="12"/>
<rect x="750" y="125" width="370" height="95" rx="12"/>
<rect x="80" y="365" width="370" height="95" rx="12"/>
<rect x="750" y="365" width="370" height="95" rx="12"/>
</g>
<g font-size="24">
<text x="265" y="167">Dℂ = ℂ[η] / (η²)</text><text x="265" y="200" font-size="18">standard dual numbers</text>
<text x="935" y="164">Ãℂ = ℂ[t±¹, u±¹] / (j²)</text><text x="935" y="200" font-size="18">j = (t−1)(u−1)</text>
<text x="265" y="407">ℂ[I, R_N] ≅ Dℂ</text><text x="265" y="440" font-size="18">R_N² = 0, R_N ≠ 0</text>
<text x="935" y="407">ℂ[Tg] ≅ ℂ[z] / (z³)</text><text x="935" y="440" font-size="18">Tg² = R_N, Tg³ = 0</text>
</g>
<g stroke="#20596b" stroke-width="2.5" marker-end="url(#a)" fill="none">
<path d="M465,172 L735,172"/><path d="M265,234 L265,350"/>
<path d="M935,234 L935,350"/><path d="M465,412 L735,412"/>
</g>
<g font-size="19">
<text x="600" y="150">ι: η ↦ j (injective)</text>
<text x="140" y="285">σ_N: η ↦ R_N</text><text x="145" y="315">isomorphism</text>
<text x="1075" y="270">ρg: t,u ↦ I+Tg</text><text x="1075" y="300">j ↦ R_N</text><text x="1075" y="330" font-size="16">kernel (x−y, x³)</text>
<text x="600" y="389">inclusion: R_N = Tg²</text>
<text x="600" y="507">Tg = √ε_N (f_N g† + g e_N†), with g any unit vector in {e_N,f_N}⊥</text>
<text x="600" y="547">No distinguished g is chosen. Every map has the same fixed image η ↦ R_N.</text>
<text x="600" y="593" font-size="21">NI15–16: Tor₁ᴰ(ℂ,E) ≅ ker R_N / im R_N ≅ ker W_N</text>
<text x="600" y="623" font-size="17">The full arithmetic module retains q−2 nonflat directions.</text>
</g></g></svg>
