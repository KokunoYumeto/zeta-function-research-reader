<style>
:root{--ink:#163344;--muted:#516875;--line:#9bb2bd;--paper:#fffdf8;--accent:#0d6970}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{max-width:1040px;margin:0 auto;padding:42px 44px 80px;background:var(--paper);color:var(--ink);font:17px/1.63 Georgia,serif}h1,h2,h3,nav,#TOC{font-family:system-ui,sans-serif}h1{font-size:2.15rem;line-height:1.2;letter-spacing:-.04em}h2{font-size:1.5rem;margin:48px 0 16px;border-top:1px solid #d8e1e2;padding-top:25px}h3{font-size:1.14rem;margin-top:30px}a{color:var(--accent)}nav{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;padding-bottom:22px;border-bottom:3px solid var(--accent)}#TOC{background:#edf3f1;padding:18px 28px;margin:28px 0;border-radius:8px;font-size:14px}#TOC ul{padding-left:20px;margin:5px}code{font-size:.9em;overflow-wrap:anywhere}pre{padding:18px;background:#edf3f1;overflow:auto;border-radius:6px}p{overflow-wrap:break-word}table{display:block;overflow:auto;border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #ccd7db;text-align:left}blockquote{border-left:4px solid var(--accent);margin:20px 0;padding:4px 22px;background:#f1f5f1}math{font-size:1.02em}footer{font:13px system-ui;color:var(--muted);margin-top:48px}
@media(max-width:600px){body{padding:25px 17px 55px;font-size:16px}h1{font-size:1.8rem}h2{font-size:1.25rem}#TOC{padding:15px}nav{gap:10px;font-size:13px}}
</style>
