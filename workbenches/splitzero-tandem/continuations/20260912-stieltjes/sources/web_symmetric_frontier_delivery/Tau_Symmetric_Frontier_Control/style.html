<style>
:root {--ink:#172737;--muted:#5d6874;--accent:#087d83;--line:#cad8df;--paper:#fff;--bg:#edf3f5;}
html{background:var(--bg);scroll-behavior:smooth;}body{font-family:Georgia,serif;line-height:1.66;color:var(--ink);background:var(--paper);max-width:1100px;margin:28px auto;padding:40px 52px;box-sizing:border-box;}h1,h2,h3,h4,nav,#TOC{font-family:system-ui,sans-serif;line-height:1.3;}h1{font-size:2.2rem;letter-spacing:-.03em;}h2{font-size:1.45rem;border-top:1px solid var(--line);padding-top:26px;margin-top:42px;}h3{font-size:1.13rem;margin-top:26px;}a{color:var(--accent);text-decoration-thickness:1px;}strong{font-weight:700;}code{background:#edf3f5;padding:.12em .3em;font-size:.9em;overflow-wrap:anywhere;}pre{padding:18px;background:#edf3f5;overflow:auto;}table{border-collapse:collapse;display:block;overflow:auto;}td,th{padding:10px;border:1px solid var(--line);}nav{font-size:.86rem;padding:14px 0;border-bottom:3px solid var(--accent);display:flex;gap:18px;flex-wrap:wrap;}#TOC{background:#f4f7f8;padding:18px 22px;font-size:.9rem;border:1px solid var(--line);}#TOC ul{padding-left:22px;}#TOC li{margin:5px 0;}p{overflow-wrap:break-word;}.equation{display:flex;gap:12px;align-items:center;border-left:3px solid var(--line);margin:22px 0;padding:14px 8px;max-width:100%;box-sizing:border-box;}.equation-scroll{overflow:auto;min-width:0;flex:1;padding:4px 0;}.equation-label{font:12px system-ui;color:var(--muted);white-space:nowrap;}.equation math{display:block;width:max-content;min-width:0;max-width:none;margin:auto;}footer{margin-top:45px;border-top:1px solid var(--line);font:13px system-ui;color:var(--muted);padding-top:20px;}@media(max-width:720px){body{margin:0;padding:24px 19px;}h1{font-size:1.7rem;}h2{font-size:1.2rem;}.equation{padding:12px 3px;gap:5px;}nav{gap:12px;}}
</style>
