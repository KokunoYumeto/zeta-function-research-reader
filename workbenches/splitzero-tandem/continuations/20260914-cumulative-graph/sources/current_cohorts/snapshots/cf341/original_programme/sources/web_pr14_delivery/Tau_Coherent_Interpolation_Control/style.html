<style>
:root{--ink:#192734;--muted:#526472;--accent:#0f646c;--line:#d7e2e4;--paper:#ffffff;--wash:#f0f5f5}
html{scroll-behavior:smooth;background:var(--wash)}
body{font:17px/1.66 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);max-width:1000px;margin:0 auto;padding:34px 48px 80px;background:var(--paper)}
h1{font-size:2.2rem;line-height:1.18;border-bottom:5px solid var(--accent);padding-bottom:20px;margin:12px 0 25px}
h2{font-size:1.4rem;line-height:1.3;margin-top:2.8rem;padding-top:1rem;border-top:1px solid var(--line)}
h3{font-size:1.15rem}a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
p{margin:1rem 0}strong{font-weight:670}code{font-size:.88em;background:var(--wash);padding:.1em .25em;border-radius:3px;overflow-wrap:anywhere}
pre{white-space:pre-wrap;background:var(--wash);padding:18px;overflow:auto}
.math.display{display:block;overflow-x:auto;overflow-y:hidden;padding:15px 6px;margin:18px 0;border-left:3px solid var(--line)}
math{font-size:1.08em}math[display="block"]{margin:0;min-width:min-content}
#TOC{background:var(--wash);border:1px solid var(--line);padding:16px 22px;margin:26px 0;font-size:.9rem}#TOC ul{padding-left:20px;margin:.3em 0}#TOC a{text-decoration:none}
.kicker{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}.navigation{border:1px solid var(--line);border-radius:4px;padding:13px 17px;font-size:.9rem;background:var(--wash)}
@media(max-width:650px){body{padding:20px 18px 50px;font-size:16px}h1{font-size:1.7rem}h2{font-size:1.25rem}.math.display{margin-left:-5px;margin-right:-5px}}
</style>
