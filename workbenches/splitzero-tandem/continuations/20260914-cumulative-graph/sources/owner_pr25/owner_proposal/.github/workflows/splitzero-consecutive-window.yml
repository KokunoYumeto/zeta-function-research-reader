name: SplitZero consecutive window integration
on:
  push:
    branches: [main, astra/consecutive-window-norm-20260913]
    paths:
      - 'formal/splitzero/**'
      - 'workbenches/tau-consecutive-window-formal/**'
      - '.github/workflows/splitzero-consecutive-window.yml'
  pull_request:
    paths:
      - 'formal/splitzero/AuditConsecutiveWindow.lean'
      - 'formal/splitzero/SplitZeroConsecutiveWindow.lean'
      - 'formal/splitzero/SplitZeroWindowProduct.lean'
      - 'formal/splitzero/SplitZeroWindowForcing.lean'
      - 'formal/splitzero/SplitZeroNormEnvelope.lean'
      - 'workbenches/tau-consecutive-window-formal/**'
      - '.github/workflows/splitzero-consecutive-window.yml'
permissions:
  contents: read
concurrency:
  group: consecutive-window-${{ github.ref }}
  cancel-in-progress: true
jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formal/splitzero
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Original core and unchanged pinned environment
        run: |
          set -euo pipefail
          python3 prepare.py
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake update >WindowSetup.log 2>&1 || { tail -80 WindowSetup.log; exit 1; }
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get >>WindowSetup.log 2>&1 || { tail -80 WindowSetup.log; exit 1; }
      - name: Strict source checks
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          for name in SplitZeroTodaVolume SplitZeroConsecutiveWindow SplitZeroWindowProduct SplitZeroWindowForcing SplitZeroNormEnvelope; do
            echo "=== $name ==="
            lake env lean --trust=0 -DwarningAsError=true -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
      - name: Transitive axiom reports
        run: |
          set -euo pipefail
          lake env lean --trust=0 -DwarningAsError=true AuditConsecutiveWindow.lean | tee AuditConsecutiveWindow.log
          python3 ../../workbenches/tau-consecutive-window-formal/check_window.py --audit AuditConsecutiveWindow.log
      - name: Exact regressions and optimized negative controls
        run: |
          set -euo pipefail
          checker=../../workbenches/tau-consecutive-window-formal/check_window.py
          python3 "$checker"
          python3 -O "$checker"
          if python3 "$checker" --negative >neg.log 2>&1; then exit 1; fi
          grep -q 'intentional negative control' neg.log
          if python3 -O "$checker" --negative >neg.log 2>&1; then exit 1; fi
          grep -q 'intentional negative control' neg.log
      - name: Replay unchanged published arithmetic-source regressions
        run: |
          set -euo pipefail
          src=../../workbenches/tau-arithmetic-endpoint-bounds
          test "$(git hash-object "$src/check_endpoint_bounds.py")" = 5f9e027c0906bf667eebcda1a6de04c131442674
          test "$(git hash-object "$src/check_balanced_window.py")" = 0d168be17ce9f44ba9761c4810ff73cc2cd66033
          python3 -m venv "$RUNNER_TEMP/window-checks"
          py="$RUNNER_TEMP/window-checks/bin/python"
          "$py" -m pip install 'sympy==1.14.0' 'mpmath==1.3.0' >SourceTestSetup.log 2>&1 || { cat SourceTestSetup.log; exit 1; }
          for checker in check_endpoint_bounds.py check_balanced_window.py; do
            "$py" "$src/$checker" >"$checker.normal.json"
            "$py" -O "$src/$checker" >"$checker.optimized.json"
            cmp "$checker.normal.json" "$checker.optimized.json"
            cat "$checker.normal.json"
            if "$py" "$src/$checker" --fail-control >source-negative.log 2>&1; then exit 1; fi
            grep -q 'intentional' source-negative.log
            if "$py" -O "$src/$checker" --fail-control >source-negative.log 2>&1; then exit 1; fi
            grep -q 'intentional' source-negative.log
          done
